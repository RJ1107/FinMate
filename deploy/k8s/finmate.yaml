apiVersion: v1
kind: Namespace
metadata:
  name: finmate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: finmate-config
  namespace: finmate
data:
  APP_ENV: production
  MARKET_PROVIDER: auto
  MARKET_CACHE_TTL_SECONDS: "60"
  CORS_ORIGINS: https://heyfinmate.com,https://www.heyfinmate.com
  OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
  OPENROUTER_MODEL: qwen/qwen3.5-flash-02-23
  OPENROUTER_FALLBACK_MODEL: deepseek/deepseek-v3.2
  OPENROUTER_HTTP_REFERER: https://heyfinmate.com
  OPENROUTER_APP_TITLE: FinMate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finmate-backend
  namespace: finmate
  labels:
    app: finmate-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: finmate-backend
  template:
    metadata:
      labels:
        app: finmate-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: finmate-config
            - secretRef:
                name: finmate-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: finmate-backend
  namespace: finmate
spec:
  selector:
    app: finmate-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finmate
  namespace: finmate
  labels:
    app: finmate
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: finmate
  template:
    metadata:
      labels:
        app: finmate
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: frontend
          image: __FRONTEND_IMAGE__
          imagePullPolicy: Always
          env:
            - name: BACKEND_UPSTREAM
              value: finmate-backend:8000
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: finmate
  namespace: finmate
spec:
  selector:
    app: finmate
  ports:
    - name: http
      port: 80
      targetPort: http
