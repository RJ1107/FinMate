[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finmate-api"
version = "0.1.0"
description = "Explainable A-share market intelligence API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "langgraph>=1.2.0,<2.0.0",
  "openai>=2.8.0,<3.0.0",
  "pydantic-settings>=2.6.0",
  "requests>=2.32.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
